name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    if: ${{ !github.event.deleted }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check tag version
        shell: bash
        run: |
          version=$(cat VERSION)
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            printf '::error::VERSION is %s but the tag is %s\n' "$version" "$GITHUB_REF_NAME"
            exit 1
          fi

      - uses: cachix/install-nix-action@v31

      - name: Build, test, and package
        shell: bash
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          package=$(nix build --print-build-logs --no-link --print-out-paths "path:.#packages.$TARGET_SYSTEM.default")
          test "$("$package/bin/c-docc" --version)" = "c-docc $GITHUB_REF_NAME"

          bundle="c-docc-$GITHUB_REF_NAME-$TARGET_SYSTEM"
          staging="$RUNNER_TEMP/$bundle"
          mkdir -p "$staging" dist
          printf '%s\n' "$package" > "$staging/store-path"
          nix-store --query --requisites "$package" > "$RUNNER_TEMP/requisites"
          mapfile -t requisites < "$RUNNER_TEMP/requisites"
          nix-store --export "${requisites[@]}" > "$staging/closure.nix-export"

          cat > "$staging/README.txt" <<'EOF'
          This archive contains c-docc and its Nix runtime dependencies.
          Extract it and run these commands inside the extracted directory.

          nix-store --import < closure.nix-export
          "$(cat store-path)/bin/c-docc" --version

          Use a trusted Nix account to import the archive on a multi-user installation.
          EOF
          tar -C "$RUNNER_TEMP" -czf "dist/$bundle.tar.gz" "$bundle"

      - name: Package VS Code extension
        if: matrix.system == 'x86_64-linux'
        shell: bash
        run: |
          nix develop . --command npm --prefix editors/vscode run package
          mkdir -p dist
          cp "build/docc-$GITHUB_REF_NAME.vsix" "dist/c-docc-$GITHUB_REF_NAME.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: c-docc-${{ matrix.system }}
          path: |
            dist/*.tar.gz
            dist/*.vsix
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build-windows:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          pacboy: >-
            clang:p
            clang-tools-extra:p
            libc++:p
            llvm:p
            cmake:p
            ninja:p
            cmark:p
            libutf8proc:p

      - name: Build, test, and package
        run: |
          test "$(tr -d '\r' < VERSION)" = "$GITHUB_REF_NAME"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$MINGW_PREFIX")"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

          bundle="c-docc-$GITHUB_REF_NAME-x86_64-windows"
          staging="$(cygpath -u "$RUNNER_TEMP")/$bundle"
          cmake --install build --prefix "$staging"
          cp -R "$MINGW_PREFIX/share/licenses" "$staging/licenses"
          test "$(PATH=/usr/bin "$staging/bin/c-docc.exe" --version | tr -d '\r')" = "c-docc $GITHUB_REF_NAME"

          mkdir -p dist
          output="$PWD/dist/$bundle.zip"
          cd "$(dirname "$staging")"
          cmake -E tar cf "$output" --format=zip "$bundle"

      - uses: actions/upload-artifact@v7
        with:
          name: c-docc-x86_64-windows
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: c-docc-*
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=("c-docc-$tag-x86_64-linux.tar.gz" "c-docc-$tag-aarch64-linux.tar.gz"
                  "c-docc-$tag-x86_64-windows.zip" "c-docc-$tag.vsix")
          sha256sum "${assets[@]}" > SHA256SUMS
          printf -v notes 'Run with Nix using %s. Each Linux archive includes the runtime dependencies and import instructions. On Windows x64, extract the ZIP and run bin/c-docc.exe. Install the VS Code extension from the .vsix file.' "\`nix run github:$GH_REPO/$tag\`"

          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release upload "$tag" "${assets[@]}" SHA256SUMS --clobber
            if [[ "$draft" == true ]]; then
              gh release edit "$tag" --draft=false --verify-tag
            fi
          else
            gh release create "$tag" "${assets[@]}" SHA256SUMS --verify-tag --generate-notes --notes "$notes"
          fi
